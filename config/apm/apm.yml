name: opencode-config
version: 1.0.0
description: Global OpenCode
targets:
  - opencode

dependencies:
  apm:
    - multica-ai/andrej-karpathy-skills

  mcp:
    - name: playwright
      registry: false
      transport: stdio
      command: "mise"
      args:
        - exec
        - --
        - npx
        - -y
        - "@playwright/mcp@latest"
        - "--headless"
        - "--browser=chromium"
      enabled: true
    - name: context7
      registry: false
      transport: stdio
      command: "mise"
      args:
        - exec
        - --
        - npx
        - -y
        - "@upstash/context7-mcp"
      enabled: true
    - name: notion
      registry: false
      transport: http
      url: "https://mcp.notion.com/mcp"
      enabled: true

lifecycle:
  post-install:
    - type: command
      description: Install Caveman for OpenCode
      bash: "mise exec -- npx -y github:JuliusBrussee/caveman -- --only opencode --all --force"
      timeoutSec: 180

    - type: command
      description: Install Ponytail OpenCode plugin
      bash: "mise exec -- opencode plugin add @dietrichgebert/ponytail"
      timeoutSec: 120

    - type: command
      description: Install Opencode models discovery
      bash: "mise exec -- opencode plugin add opencode-models-discovery"
      timeoutSec: 120

    - type: command
      description: Install Superpowers OpenCode plugin
      bash: "mise exec -- opencode plugin add superpowers@git+https://github.com/obra/superpowers.git"
      timeoutSec: 180

    - type: command
      description: Initialize RTK OpenCode plugin
      bash: "mise exec -- rtk init --global --opencode"
      timeoutSec: 30

  post-update:
    - type: command
      description: Update Caveman for OpenCode
      bash: "mise exec -- npx -y github:JuliusBrussee/caveman -- --only opencode --all --force"
      timeoutSec: 180

    - type: command
      description: Update Ponytail OpenCode plugin
      bash: "mise exec -- opencode plugin add @dietrichgebert/ponytail"
      timeoutSec: 120

    - type: command
      description: Update Opencode models discovery
      bash: "mise exec -- opencode plugin add opencode-models-discovery"
      timeoutSec: 120

    - type: command
      description: Update Superpowers OpenCode plugin
      bash: "mise exec -- opencode plugin add superpowers@git+https://github.com/obra/superpowers.git"
      timeoutSec: 180

    - type: command
      description: Refresh RTK OpenCode plugin
      bash: "mise exec -- rtk init --global --opencode"
      timeoutSec: 30

  pre-uninstall:
    - type: command
      description: Remove Caveman OpenCode plugin
      bash: "mise exec -- npx -y github:JuliusBrussee/caveman -- --uninstall --non-interactive"
      timeoutSec: 120

    - type: command
      description: Remove Ponytail OpenCode plugin
      bash: "mise exec -- opencode plugin remove @dietrichgebert/ponytail"
      timeoutSec: 60

    - type: command
      description: Remove Opencode models discovery
      bash: "mise exec -- opencode plugin remove opencode-models-discovery"
      timeoutSec: 60

    - type: command
      description: Remove Superpowers OpenCode plugin
      bash: "mise exec -- opencode plugin remove superpowers@git+https://github.com/obra/superpowers.git"
      timeoutSec: 120

    - type: command
      description: Remove RTK OpenCode integration
      bash: "mise exec -- rtk init --uninstall --global --opencode"
      timeoutSec: 30
