source = ~/.config/hypr/assets/mocha.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/.current_wallpaper

    blur_size = 6
    blur_passes = 3

    noise = 0.0117
    contrast = 1.3000
    brightness = 0.7500
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:5000] echo "󰁿 $(cat /sys/class/power_supply/BAT0/capacity)% ‎"
    color = $subtext1
    font_size = 11
    font_family = SF Pro 
    position = -20, -10
    halign = right
    valign = top
    zindex = 5
}

# Avatar circle
shape {
    monitor =
    size = 100, 100
    color = rgba(cdd6f433)
    rounding = 999
    position = 0, 190
    halign = center
    valign = bottom
}

# Avatar initial
label {
    monitor =
    text = cmd[update:18000000] echo "<b>$(echo "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]')</b>"
    color = $text
    font_size = 44
    font_family = SF Pro Display

    position = 0, 200
    halign = center
    valign = bottom
}

# Time — big, regular weight, macOS style
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = $text
    font_size = 150
    font_family = SF Pro Display
    shadow_passes = 5
    shadow_size = 8
    shadow_color = rgba(00000066)

    position = 0, 300
    halign = center
    valign = center
}

# Date under the clock
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %e' | sed 's/  */ /g')"
    color = $subtext1
    font_size = 22
    font_family = SF Pro Display

    position = 0, 195
    halign = center
    valign = center
}

# Username under avatar
label {
    monitor =
    text = cmd[update:18000000] echo "<b>"$USER"</b>"
    color = $text
    font_size = 16
    font_family = SF Pro Display

    position = 0, 145
    halign = center
    valign = bottom
}

# macOS hint line
label {
    monitor =
    text = cmd[update:18000000] echo "Touch ID or Enter Password"
    color = $subtext0
    font_size = 11
    font_family = SF Pro Display

    position = 0, 45
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2

    dots_size = 0.26 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1

    rounding = 25
    outer_color = rgba(cdd6f455)
    inner_color = rgba(1e1e2e99)
    font_color = $text
    font_family = SF Pro Display 14
    fade_on_empty = false
    placeholder_text = Enter Password

    position = 0, 80
    halign = center
    valign = bottom
}
